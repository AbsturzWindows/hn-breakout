name: Train
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate: fixed periods · final: test period once, register (01.12.) · retrain: last 7 days, register"
        type: choice
        options: [validate, final, retrain]
        default: validate
  # schedule (weekly retrain): added after the final evaluation on 01.12.

permissions:
  contents: read
  id-token: write   # GitHub's login token for Google (read-only access to the bucket)

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group train
      - run: uv run hn-train --${{ inputs.mode || 'retrain' }}   # a scheduled run has no input
        env:
          STORAGE_ROOT: ${{ vars.STORAGE_ROOT }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          GIT_SHA: ${{ github.sha }}
